name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### AI Agent 支持图片（多模态）
            - **图片输入**：AI 对话支持发送图片——截图可直接 Ctrl+V 粘贴到输入框，也可点底部图片按钮多选文件；发送前自动压缩（长边 ≤1568px、JPEG 重编码），单条消息最多 6 张。
            - **模型能力开关**：AI 配置的模型行新增「图片」勾选；拉取导入模型时按模型 ID 自动预填常见视觉模型（qwen-vl、gpt-4o、gemini、claude、glm-4v 等）。未开启视觉的模型不显示图片入口。
            - **跨轮可见**：图片随最近对话窗口一并提交，后续追问「上面那张图」模型仍能看到；被上下文压缩消化掉的旧轮次自动降级为占位标记，控制 token 成本。
            - 图片在聊天气泡中渲染缩略图，历史会话恢复后仍可见。

            ### 监控面板
            - 切换主机后返回监控面板**秒回显**上次数据（快照/趋势按主机缓存），不再有「加载中」空窗，后台照常 5 秒刷新为最新值。
            - 流量卡底部文案改为「累计 流入 / 流出」，与头部实时速率箭头区分。

            ### AI 配置
            - 修复编辑已有配置时平台预设一律反显为「自定义」的问题：现按 base_url 反查预设（兼容 `/v1` 后缀差异），DeepSeek/OpenAI/通义千问/Kimi/Ollama 正确反显。
            - 修复「拉取可用模型」列表复选框独占一行、模型信息被挤出可视区的问题，现在每个模型一行显示。
            - 移除「批量导入默认窗口」设置项（新增/导入模型直接按 128k 预填，可在模型行单独修改）。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
