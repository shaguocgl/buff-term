name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### SFTP 文件浏览提速

            - **持久 SFTP 浏览会话**：每个主机复用一条 SFTP 会话处理目录浏览类操作（列表/删除/新建/重命名/读写小文件），不再每次重建 channel 与子系统握手——点击目录的等待从约 4 个网络往返降为约 1 个。
            - **目录预取**：展开一个目录后，后台限流预取直接子目录（上限 12 个、全局并发 3）——下一次点击子目录通常直接命中缓存，零网络等待。
            - **符号链接并发解析**：目录内符号链接的目标类型判定由串行改为并发，链接密集目录（如 /usr/bin）加载明显加快。

            ### SFTP 可靠性

            - **会话与连接同寿命**：浏览会话持有 SSH 连接租约，连接池不再把「正在浏览」的连接误判为空闲而回收；失效时仅清除对应的旧会话，不影响并发重建的新会话。
            - **失败自动重建**：操作失败后先探活区分「业务错误」与「会话已断」——业务错误（如文件不存在）原样返回不重试；会话断开则自动重建并重试一次。
            - **上传预检修复**：文件存在性检查现在区分「确实不存在」与「查询失败」，连接异常时不再误判为不存在而跳过覆盖确认。
            - **传输与浏览互不影响**：上传/下载仍走独立通道，大文件传输期间目录树保持响应。
            - **删除主机即清会话**：删除主机时同步释放其缓存的浏览会话与连接租约。

            ### English highlights

            - **Faster SFTP browsing**: one persistent SFTP session per host serves all browse operations (list/delete/mkdir/rename/small reads+writes), removing per-click channel and subsystem handshakes (~4 RTTs → ~1); after expanding a directory, its immediate children are prefetched in the background (bounded queue, global concurrency 3) so the next click is often instant; symlink targets are now resolved concurrently.
            - **More reliable SFTP sessions**: the cached session holds the SSH connection lease so the pool never reaps a connection mid-browse; failures are probed to distinguish business errors from dead sessions and rebuild once automatically; existence checks no longer mask query failures; transfers still run on independent channels; deleting a host releases its session.

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
