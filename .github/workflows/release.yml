name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 导入 ~/.ssh/config
            - 修复没有 `HostName` 时导入出空地址的问题：按 ssh 语义改用 `Host` 别名作为主机名，`Host 10.0.0.1` 这类写法不再产出连不上的主机。
            - 修复没有 `User` 时导入出空用户名的问题：按 ssh 语义回退到本机用户名（Unix 取 `USER`，Windows 取 `USERNAME`）。
            - 修复 `Match` 条件块的字段被并入上一个 `Host` 的问题：此前会把 `Match` 块里的 `User` / `Port` 错误地写进前一台主机。
            - `IdentityFile` 的值现在会剥离两端引号（路径含空格时可正确解析）；多行 `IdentityFile` 取第一个，与 ssh 的尝试顺序一致。
            - 支持带 UTF-8 BOM 的配置文件：此前用记事本保存的 config 会静默漏掉第一台主机。
            - 导入结果提示更准确：新增「忽略 N 条通配规则或空 Host 行」，不再出现「没有可导入的主机」与实际不符的情况。
            - 导入前先预览并弹确认窗口：显示将要导入的数量与重名跳过数量，并提示导入的主机不含密码与私钥口令，需要时在主机编辑中补充。

            ### 侧边栏
            - 侧栏底部菜单（MCP 服务 / 通知配置 / 终端防护 / 操作审计 / 检查更新）新增「收起 / 展开」开关：收起后把约 210px 纵向空间让给主机列表，状态本地记忆；收起期间若有可用更新，仍以「有更新」角标提示。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
