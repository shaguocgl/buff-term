name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 窗口外观（Windows 无边框窗口）
            - 去掉原生白色标题栏：Windows 下窗口改为无边框（`decorations: false`），应用内容直接铺满整个窗口，不再有顶部那条割裂的白色标题条。
            - 最小化 / 最大化 / 关闭三个按钮移到标签栏最右侧，与标签同一行；悬浮高亮、关闭按钮悬浮变红，观感对齐 Windows 原生标题栏按钮。
            - 最大化状态实时同步：窗口最大化后第二个按钮自动切换为「向下还原」图标，还原后切回。
            - 双击标签栏（即标题栏区域）即可最大化 / 还原，补回无边框窗口缺失的原生交互。
            - 无标签页的欢迎页同样在右上角提供三个按钮，不会出现无法最小化 / 关闭的情况。
            - 关闭窗口阴影（`shadow: false`）：消除无边框窗口四周的一圈浅色描边与留白，窗口边缘干净利落。
            - 窗口边缘拖拽缩放、Win+方向键贴靠、拖到屏幕顶部贴靠等原生行为均保持正常。
            - macOS 不受影响：仍使用原生红绿灯，前端通过 `isDecorated()` 自动判定，仅在无边框窗口下才自绘按钮。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
