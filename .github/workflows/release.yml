name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### SFTP 批量上传
            - 上传支持多选：文件选择框可一次选中多个文件批量上传，最多 3 个任务并发传输，避免一次性打开过多 SFTP 通道把 SSH 连接打满。
            - 每条传输拥有独立进度与取消按钮；同时存在多个任务时显示汇总行（任务数 + 「全部取消」）。
            - 冲突汇总确认：上传前统一检查远端是否已存在同名文件，冲突项汇总为一次确认，可选择「全部覆盖」或「跳过冲突项」仅上传其余文件；单个文件冲突时保持原有的覆盖确认交互。
            - 失败汇总提示：批量上传中的失败逐条累加展示（文件名 + 原因），不会因为切换目录而丢失。
            - 批量传输结束后，仅当用户仍停留在目标目录时才刷新列表，避免长任务结束时把已切换目录的用户拽回原目录。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
