name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            - 主机与面板：主机搜索、Cmd+K 命令面板、面板偏好持久化；侧栏搜索框与版本号行布局微调。
            - 终端增强：终端内搜索、URL 点击、字号缩放；全局快捷键；终端断线自动重连。
            - SFTP：传输进度条、取消、路径输入框与覆盖确认；上传取消时半成品清理更健壮。
            - 监控与 AI：监控面板打开时回填后端历史指标趋势；AI 审批超时改为按拒绝处理（不再终止会话），审批卡片增加倒计时与命中原因；AI 模型列表按钮宽度对齐。
            - 体验优化：统一自研确认/输入弹窗替换全部 window.confirm/prompt，错误信息统一格式化；聊天面板流式输出滚动跟随，工具输出与代码块支持折叠复制；浅色主题漏色清理，31 处颜色归入设计 token。
            - 其他：README 增加官网链接、文档描述调整。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
