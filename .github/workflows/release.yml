name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 监控面板：连接主机即开始采集

            - **连接即采集，打开即有数据**：终端会话建立后立即启动后台监控，不再等打开监控面板才采集；打开面板即可看到连接以来的 CPU / 内存 / 流量趋势，多主机来回切换也不丢数据。
            - **复用终端会话连接**：监控脚本改为在会话自身的 SSH 连接上执行（channel 级），不再为每台主机额外占用连接池连接，多主机同时连接时更稳定；会话关闭即停止采集。
            - **自适应采集频率**：面板打开时保持 5 秒刷新；面板关闭（后台静默）自动降为 30 秒一次，面板重新打开后数秒内恢复 5 秒，后台静默期间远端 CPU / 流量开销降低约 6 倍。
            - **面板打开秒回显**：面板打开 / 切换主机时一次性回填连接以来的完整历史（含面板关闭期间的数据），趋势图不再出现空窗与断档。
            - **采集更稳健**：采集失败自动退避重试（2s → 30s 封顶，成功即恢复）；关闭会话立即中断远端采集脚本；同一主机多标签共用同一采集任务。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
