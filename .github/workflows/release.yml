name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: KeyWisp Agent Ops v__VERSION__
          releaseBody: |
            ## 升级内容

            - 修复“检查更新”发现新版本后无法跳转 GitHub Release 页面的问题，现在点击会通过系统浏览器打开。
            - 右侧面板（AI / 文件 / 监控 / 巡检）支持鼠标拖拽调整宽度（280px 至窗口宽度一半）。
            - 新增日间 / 夜间主题切换：日间为纯白主题，终端配色跟随主题，切换偏好自动保存。
            - 左侧边栏支持收起 / 展开：收起后仅显示图标栏，悬停展开主机列表与功能提示。
            - 界面细节优化：Logo 圆角处理、主机卡片与标签去除蓝色强调条、AI 模型选择框限制最大宽度。
            - 移除终端自动注入 bat 别名，恢复 `cat` 原生行为。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
