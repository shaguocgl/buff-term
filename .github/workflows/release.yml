name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            - Agent 代码重构：拆分为 tools / trend 独立模块，提升可维护性与可扩展性。
            - 控制对话上下文长度，避免长会话 token 爆炸。
            - 优化监控指标与趋势分析：历史趋势查询更稳定，支持资源变化诊断与预测。
            - 强化安全判定与输出处理：危险命令 / 只读检测更完善。
            - 精简 README，文档更聚焦。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
