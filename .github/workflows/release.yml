name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 安全加固
            - SSH 主机密钥指纹确认（TOFU）：首次连接未知主机需核对指纹并显式信任后才记录，60 秒倒计时，超时按拒绝处理。
            - 凭据加密存储：MCP 服务 Token 与 SMTP 密码改为 AES-256-GCM 加密落库，并自动迁移历史明文凭据；API Key 仅在 base_url 与库中记录一致时才回退使用，防止凭据重定向。
            - 审批与脱敏：统一规范化工具名，审批判定与实际执行用同一套名称，杜绝别名绕过审批；写操作（修改/删除/安装/网络写入）同样需批准；命令落库前统一脱敏。

            ### 稳定性与健壮性
            - SSE 流式解析改为字节缓冲 + 按行解码，修复中文/emoji 被截断；停止操作可中断阻塞读与正在执行的工具。
            - 会话历史代数改按 session_id 索引，修复同主机多会话互相覆盖历史的问题。
            - 终端危险命令判定增加一致性校验与回退，修复无标记提示符 + 命令含 # $ % > 时漏判。
            - 数据库操作原子化：AI 提供方保存/启用、主机级联删除（关联指标/审计/巡检/整改）、审计日志清理、异常遗留任务取消。
            - 规则/设置版本号与缓存失效；SMTP 发送移至 spawn_blocking 避免阻塞；MCP 增加 CORS/白名单/常量时间 token 比对。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
