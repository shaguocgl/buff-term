name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### AI Agent 上下文管理

            - **按预算触发压缩**：上下文预算充足时保留完整对话，接近上限才压缩较早轮次——不再固定只发最近 6 轮；同一条任务内的多次工具往返也能压缩。
            - **结构化摘要检查点**：较早历史压缩为带轮次引用的结构化摘要（目标、约束、事实、执行记录、未解决问题），摘要服务不可用时回退规则摘录；积压前缀分批追上，不会永久卡在「放不下」。
            - **长输出本地归档 + 按需回查**：超长命令输出脱敏后存入会话级私有临时目录，对话中只留折叠重复的预览；模型可通过新工具 recall_context 分页回查原文，无需重新执行命令。
            - **归档生命周期兜底**：异常退出残留的归档在下次启动自动回收（存活锁识别仍在使用的目录），正常退出显式清理，单会话归档设有容量上限。
            - **停止/清空响应更及时**：归档写入与原文回查等待现在响应取消，不再卡住会话租约；中断时已完成工具调用的结果仍正确写回历史。

            ### 文件侧边栏改版

            - **IDE 风格目录树**：目录行前置 ▸/▾ 展开图标，点击目录选中并展开，折叠目录不重复请求远端；目录懒加载，刷新只重拉展开中的目录。
            - **打开即定位终端目录**：新增终端工作目录跟踪（识别 cd / pushd / popd / 子 shell 进出），关闭再打开侧边栏时自动跳到当前终端所在路径。
            - **上传目标一目了然**：顶部显示当前主机名与 user@host:port，下方面包屑实时显示选中目录（即上传目标），可点击跳转或切换为路径输入。
            - **选中态高亮**：当前选中目录行高亮显示，避免误传到错误目录。

            ### English highlights

            - **Budget-triggered context compression**: full history is kept while budget allows; older rounds are compressed into structured, citation-bearing checkpoints only near the limit, with batched catch-up and a deterministic fallback.
            - **Long-output archiving + recall**: oversized command output is sanitized and archived to a private per-session directory; a new recall_context tool pages through originals on demand. Stale archives are swept at startup, cleaned on exit, and capped in size; archive waits now honor cancel/reset.
            - **File sidebar redesign**: IDE-style lazy-loaded tree with chevron toggles, selected-directory highlighting, a host + path header showing the exact upload target, and automatic jump to the terminal's current directory when reopened (via new remote-cwd tracking).

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
