name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### AI Agent 中断与历史一致性（重要修复）
            - 修复「停止 / 清空对话」后对话无法继续的问题：中断时历史里会残留没有结果的工具调用，OpenAI 兼容平台会因此拒绝下一次请求（400 错误）。现在中断时会自动为未完成的调用补齐占位结果，会话入口也会扫描并修复历史中已存在的悬挂调用。
            - 修复点「停止」留下远端孤儿进程：取消时向远端命令发送 SIGTERM 并关闭通道，不再只是断开本地连接让命令继续在服务器上跑。
            - 修复「停止」在审批等待中不生效：等待审批时中断，审批卡片会正确关闭，不会卡在「等待审批」状态。
            - 修复「停止」在网络阶段延迟生效：HTTP 连接 / 上传 / 等首字节期间即可中断，不必等响应头到达。

            ### AI Agent 执行正确性
            - 修复多工具调用执行顺序随机：模型一次返回多个工具调用时，现在严格按模型声明的顺序执行，不再因哈希表顺序导致步骤颠倒。
            - 兼容不返回调用 id 的模型：自动补本地 id，审批回执匹配与「调用 ↔ 结果」配对不再错位。

            ### AI Agent 并发与超时
            - 修复同一主机多标签页并发对话互相覆盖历史：同一主机同一时刻只允许一个 AI 循环，新消息会短暂等待旧循环退出（最多 10 秒），确属另一个标签页在用时给出明确提示。
            - 修复流式回复被整体超时打断：请求超时改为「连接 15 秒 + 数据块空闲 120 秒」，长回复（含本地 Ollama、长思考模型）不再被误判为超时。

            ### 会话隔离口径统一
            - 对话历史、任务台账、历史代数与互斥登记统一为**主机级**：清空某主机的对话会精确取消该主机上实际在跑的循环，不会误伤或漏停其他标签页。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
