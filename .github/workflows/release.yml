name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          node -e "const fs=require('fs'); const version=JSON.parse(fs.readFileSync('package.json')).version; const tauri=JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json')).version; const cargo=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version\s*=\s*\"([^\"]+)\"/m)[1]; const expected='v'+version; if (version !== tauri || version !== cargo || process.env.RELEASE_TAG !== expected) { throw new Error('Tag must be '+expected+' and package.json / tauri.conf.json / Cargo.toml versions must match.'); }"

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: KeyWisp Agent Ops v__VERSION__
          releaseBody: |
            ## 升级内容

            - 新增巡检报告「一键整改」：输入整改干预意见 → AI 生成详细整改步骤 → 用户确认后自动执行，支持步骤编辑、执行进度、失败重试与全程审计。
            - 整改完成或失败后自动发送邮件通知，包含整改步骤与执行结果。
            - 巡检新增「木马 / 挖矿风险」模块，覆盖可疑进程、异常连接、crontab / systemd timer、临时目录可执行文件与 SSH 授权文件变动。
            - 巡检采集补充 fail2ban 实际配置，整改建议基于真实数值，避免对已达标项重复建议。
            - 修复 AI 与巡检侧边栏可能同时展开的问题，保证最多展开一个侧边栏。
            - 更新应用 Logo 与安装包图标。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
