name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 新增：内置文件编辑器
            - 在右侧文件面板把鼠标移到文件行上，点「在内置编辑器中打开」（或直接双击文件行），即可在中间区以标签页打开远端文件，边看边改。
            - 基于 CodeMirror 6，按扩展名语法高亮（JS/TS、JSON、Python、Markdown、YAML、HTML/CSS、XML、SQL、Shell、ini/conf/properties、Dockerfile、nginx 配置等），配色跟随夜间 / 日间主题。
            - `Ctrl/Cmd+S` 保存；有未保存改动时标签显示红点、状态栏提示「未保存」，关闭标签前先确认。
            - 编辑器按需加载（独立分包），不增加首屏体积。

            ### 保存安全（重点）
            - **原子写入**：先写同目录临时文件再 rename 替换，写入中途断连不会把原文件截断或写坏，并沿用原文件权限。
            - **并发修改保护**：保存前校验远端 mtime，文件已被其它程序改动时拒绝覆盖，并提示重新加载。
            - **符号链接安全**：经链接打开 / 保存时写入真实目标文件，不会把符号链接替换成普通文件。
            - **敏感路径二次确认**：`~/.ssh`、`/etc/shadow`、`/etc/sudoers`、cron、systemd、`/etc/rc.local`、登录 shell 启动脚本等路径保存前弹窗确认。
            - **大小与格式限制**：单文件上限 2 MiB，二进制 / 非 UTF-8 文件直接拒绝并提示改用「下载」，避免误打开把内存打满。
            - **操作审计**：每次保存（成功或失败）都写入审计日志，新增「文件编辑」来源，可在操作审计中按来源筛选。

            ### 文件面板交互
            - 行内操作按钮改为悬浮覆盖显示，不再占据布局空间，文件名列恢复完整宽度；悬浮行时自动让出时间列。
            - 新增「在内置编辑器中打开」按钮，与 下载 / 重命名 / 删除 并列；重命名按钮改用 SVG 图标（原 `✎` 字符在 Windows 上会被渲染成彩色 emoji）。
            - 修复行内按钮缩小后未重置内边距，导致图标溢出、在方框内偏右的问题。
            - 每台主机各自保留文件面板实例：切换标签页 / 切换主机 / 关闭编辑器后，目录位置与进行中的传输都不再被重置。

            ### 其他修复
            - 修复标签过多时拖动标签栏横向滚动条会变成拖动窗口的问题。
            - 编辑器内不再劫持 `Ctrl/Cmd+K`、`Ctrl/Cmd+T`、`Ctrl/Cmd+W`（交给编辑器自身处理）。
            - 文件标签使用独立图标与未保存标记；文件标签激活时右侧面板保持挂载，AI 会话 / SFTP 传输 / 巡检不会中断。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
