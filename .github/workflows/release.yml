name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### AI 上下文管理
            - 发送视图按模型上下文窗口做预算：每次模型调用前裁剪，预算同时计入系统提示、任务台账和工具定义，避免单轮内工具输出撑爆窗口。
            - 旧轮次规则抽取压缩（不调用额外模型）：保留命令原文、路径和错误尾部；任务锚点与最近 6 轮原文优先保留，tool_call/tool 结果不会被拆散。
            - 新增任务台账工具与面板：多步任务记录目标、约束、已完成、待办、失败尝试和当前步骤；台账每轮注入且不参与压缩，历史压缩后仍能保持任务方向。
            - 模型上下文窗口改为每个模型必填，提供 64k / 128k / 200k / 1M 快捷值；批量导入使用可配置的全局默认值预填。
            - 模型选择器旁新增上下文用量条；超过 80% 自动压缩，超限时硬重置为“系统提示 + 台账 + 任务锚点 + 最后一轮”，平台报上下文超限时自动按 50% 窗口重试一次。

            ### 上下文用量显示修正（v1.0.7）
            - 进度条改为按模型窗口显示（如 1M），并把 700k 明确标注为“输入预算”（窗口的 70%，预留 30% 给输出与安全余量）。
            - 请求默认携带 `stream_options.include_usage`，优先显示平台返回的实测 token 数；平台不支持时自动去掉该参数重试并记住该模型，后续请求不再重试。
            - 平台不返回 usage 时使用本地估算，并用该模型的历史实测值做滑动校准，标注为“估算·已校准”。
            - 切换模型或打开已有对话时，立即按当前完整历史 + 新模型窗口重新估算，不再显示上一个模型的旧数据。
            - 每次模型调用只更新一次用量，避免“估算值”和“实测值”来回跳动。

            ### 连接复用与稳定性
            - SSH 连接池：同一主机复用连接，按 LRU 淘汰最久未使用且空闲的连接，空闲 30 分钟自动回收。
            - SFTP 复用已有 SSH 连接，避免每次文件操作重新握手认证；通道/SFTP 初始化失败时清理旧连接并重连一次。

            ### 界面
            - 通知配置（SMTP）的“加密”下拉稍微加宽，选项文字更易读。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
