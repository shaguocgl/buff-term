name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### SFTP 文件传输安全

            - **上传不再损坏原文件**：上传改为先写同目录临时文件、完成后原子替换目标；中途取消或断连不会截断 / 删除已存在的远端文件。
            - **覆盖写失败可恢复**：内置编辑器保存与上传共用替换逻辑，最终替换失败时保留临时文件并在错误中给出路径，新旧内容不会同时丢失。
            - **覆盖时保留文件属性**：上传沿用原文件权限、跟随符号链接写入真实目标、目录目标直接拒绝。

            ### AI Agent 稳定性

            - **修复过期审批导致对话静默终止**：流式响应期间收到残留的审批 / 继续回执不再结束本轮，避免界面卡在「执行中」且回答丢失。
            - **修复异常参数被当作命令执行**：模型输出截断或非法的工具参数不再被猜测为 shell 命令在远端执行，改为回填错误让模型重发；工具卡片在模型漏填名称时显示兜底名。

            ### 终端命令拦截

            - **折行长命令不再漏判**：超过终端宽度自动换行的命令，拦截判定读取完整逻辑行，`rm -rf …` 等前缀不再因换行丢失。
            - **审计记录完整命令**：拦截审计改为记录审批弹窗中展示的完整命令，历史回放、Tab 补全、Ctrl-C 取消场景不再记成残片。

            ### 终端输入

            - **修复非 ASCII 键盘双写**：德语 `ä`、俄语 `ж` 等非 IME 单键字符不再被发送两次。

            ### English highlights

            - **Safer SFTP uploads**: uploads go to a same-directory temp file and atomically replace the target — cancelling or disconnecting mid-upload no longer truncates or deletes the existing remote file. If the final replace fails, the temp file is kept and its path is reported for recovery. Overwriting preserves permissions, follows symlinks to the real target, and rejects directory targets.
            - **Agent stability**: stale approve/continue messages can no longer silently end a streaming turn (which left the UI busy and dropped the reply); malformed tool-call arguments are bounced back to the model instead of being executed as shell commands.
            - **Terminal guard**: wrapped long commands are reconstructed across rows so dangerous prefixes can't slip past interception, and audit entries now record the exact command shown in the approval dialog (history replay, tab completion, Ctrl-C included).
            - **Input fix**: non-ASCII keyboard-layout characters (ä, ж, …) are no longer sent twice.

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
