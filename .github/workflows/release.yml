name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 监控面板增强
            - **主机信息卡**：面板顶部新增主机信息卡片，展示公网 IP（点击复制）、所在国家、操作系统、CPU 型号、核心数 / 线程数、内存大小与运行时长；公网 IP 与归属地由远端多服务链式查询（ip-api / ipinfo / ipify），本地接口兜底，私网主机显示「—」。
            - **磁盘卡片重构**：磁盘区改为独立卡片，卡片头部汇总展示「已用 / 总容量」；默认仅显示根分区 `/` 与实际挂载的数据盘，自动过滤 tmpfs、overlay、容器运行时等系统与伪文件系统挂载。
            - **流量监控卡**：新增网络流量卡片，绿色 / 青色双折线分别展示下行 RX 与上行 TX 实时速率，底部显示累计流量，自动排除 lo、docker、veth 等虚拟网卡。
            - **TOP10 进程**：进程列表升级为 TOP10，支持 CPU / MEM 排序一键切换，当前排序列高亮显示。
            - SWAP 存在时磁盘卡内新增 SWAP 使用进度条。

            ### 启动体验
            - **自动检查更新**：应用启动时自动静默检查一次新版本，有更新时左下角入口提示并弹出通知，无需手动点击。
            - **Star 引导弹窗**：累计启动超过 5 次后弹出感谢提示，可一键前往 GitHub 为项目点 Star；支持「以后再说」（10 次后再提醒）与「不再提示」。

            ### 修复
            - 修复切换主机后监控趋势图仍显示上一台主机历史数据的问题。
            - 修复 TOP 进程列表把 `ps` 表头误显示为进程行的问题。
            - 修复挂载在 `/dev`、`/run` 路径下的真实数据盘（如 `/dev/vdb1`）被错误过滤不显示的问题。
            - 修复监控信息卡刷新失败后已展示内容被清空的问题。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
