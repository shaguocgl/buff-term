name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### SSH 认证与主机安全（v1.0.9）
            - RSA 私钥自动协商 SHA-2 签名，兼容默认禁用 `ssh-rsa` 的现代 OpenSSH；密码认证支持 keyboard-interactive 回退。
            - 支持带口令的加密私钥与 Unix ssh-agent；私钥口令加密存储，只用于本地解密。
            - 主机指纹拒绝、确认超时、known_hosts 读取失败和指纹变化分别提示；指纹变化时展示新旧 SHA-256 指纹与记录行号。

            ### 连接、终端与命令执行
            - SSH 连接池改为通道级并发，SFTP 大文件传输不再阻塞同主机的 AI、监控、巡检和 MCP；空闲与断开连接自动回收。
            - 命令执行增加通道超时、stdin EOF、stdout/stderr 分离；复用连接断开时只读命令可安全重试，写命令避免重复执行。
            - 终端输出改用 Tauri 二进制 Channel 并合帧传输；区分 shell 正常退出与网络断线，仅断线触发可选自动重连。

            ### SFTP 与凭据安全
            - SFTP 目录改为结构化数据，支持符号链接和包含连续空格的文件名；删除链接时不跟随到目标。
            - SSH 密码、私钥口令、AI API Key、MCP token 与 SMTP 密码统一 AES-256-GCM 加密，旧版 MCP / SMTP 明文凭据启动时自动迁移。

            ### 界面
            - 未选择主机时使用 buffTerm Logo 展示空状态，并复用品牌阴影样式。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
