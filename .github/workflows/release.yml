name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### 审批与安全（v1.0.8）
            - 统一审批队列：MCP 命令审批、终端危险命令审批、SSH 主机指纹确认共用同一队列，并发审批不再互相覆盖；超时自动移除，终端审批结束后自动把焦点还给终端。
            - MCP 审计补全：记录真实状态（executed / error / denied）、执行结果与耗时；审批超时后清理挂起项，避免残留。
            - Agent 控制通道增加令牌：旧会话结束时不会误清掉新会话的控制通道；工具执行期间可被「停止」立即中断。

            ### 任务与终端稳定性（v1.0.8）
            - 整改重试保留已成功步骤，只重跑失败/未执行步骤；已成功的整改不再允许重试。
            - 终端会话增加 request_id：数据与状态事件按连接请求匹配，避免旧会话串写到新终端。

            ### 主机导入与跨平台（v1.0.8）
            - SSH config 导入按名称去重（含同一批内的重复）；主目录解析兼容 HOME / USERPROFILE / HOMEDRIVE+HOMEPATH，Windows 下支持 `~\` 展开。

            ### 监控精度（v1.0.8）
            - CPU 使用率改由 /proc/stat 差值计算，正确处理 iowait / irq / steal / guest；磁盘使用率直接采用 df 的 Use%，避免取整误差。
            - 监控面板避免请求重叠，改为上一次完成后等待 5 秒再轮询。

            ### AI 上下文管理
            - 发送视图按模型上下文窗口做预算，每次调用前裁剪；旧轮次规则抽取压缩，任务锚点、任务台账与最近窗口优先保留，tool_call/tool 结果不会拆散。
            - 新增任务台账工具与面板，多步任务记录目标、约束、进度和失败尝试，历史压缩后仍能保持方向。
            - 用量条按模型窗口显示，优先显示平台实测 token 数；平台不返回时使用本地估算并按模型实测值校准；切换模型立即按完整历史重新估算。
            - SSH 连接池与 SFTP 连接复用；通知配置的“加密”下拉稍微加宽。

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
