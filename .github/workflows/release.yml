name: Publish desktop app

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
          - name: Windows x64
            os: windows-latest
            args: --bundles nsis

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Ensure the tag matches the app version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-version.cjs

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: buffTerm v__VERSION__
          releaseBody: |
            ## 升级内容

            ### AI Agent 会话一致性

            - **清空会话不再被旧数据写回**：修复点击清空时，正在收尾的对话把旧历史与任务台账写回的竞态，清空后的会话保持干净。
            - **删除主机同步停止 AI 对话**：删除主机会立即取消该主机上正在运行的 Agent，并清空其历史与任务台账。
            - **首条回复更快**：发送消息前的主机快照改为后台采集，不再阻塞首个模型请求（此前每条消息都要先等待一次采集，慢主机上最多 25 秒）。
            - **结束状态更可靠**：对话结束事件改为在历史写回之后统一下发；在轮次上限确认处点击停止，不会再把紧接着发送的新一轮误标为已结束。

            ### 工具调用与审批

            - **审批倒计时与后台一致**：工具审批与「继续执行」确认改为固定截止时间，过期回执不再重置 600 秒计时。
            - **未知工具直接拒绝**：模型调用不存在的工具时直接回填完整的可用工具列表（补上了此前遗漏的 update_task_plan），全部审核模式下也不再先弹出一次无效的审批卡片。
            - **工具名统一规范**：模型使用别名（如 shell、exec）调用工具时，历史记录与工具卡片统一显示规范名（如 exec_command）。

            ### 趋势分析与用量

            - **修复负载趋势误报**：load 指标不再被外推为「约 N 天后达到 90%」；CPU / 内存的外推文案不再显示成「90%%」。
            - **不再丢失末尾用量**：流式响应末尾未换行的数据块中携带的 usage 也会被采信，上下文用量可显示平台实测值。

            ### 其他

            - **Agent 后端重构**：主循环拆分为请求、流式解析、审批判定、工具执行等独立模块，Agent 模块单元测试由 44 个增至 80 个。

            ### English highlights

            - **Conversation consistency**: clearing a chat can no longer be undone by a finishing run writing its stale history or task plan back; deleting a host now stops its running agent and clears its history and task plan.
            - **Faster first reply**: the per-message host snapshot now runs in the background instead of delaying the first model request (by up to 25s on slow hosts).
            - **Approvals & tools**: approval and continue prompts use a fixed deadline that matches the on-card countdown; unknown tools are rejected up front with the full tool list (now including update_task_plan); tool aliases are shown and recorded under their canonical names.
            - **Fixes**: load average is no longer extrapolated to "90%", CPU/memory extrapolations no longer print "90%%", and usage reported in an unterminated final stream line is no longer dropped.
            - **Refactor**: the agent loop is split into focused modules; agent unit tests grew from 44 to 80.

            ## 安装包

            请根据操作系统下载对应的 DMG 或 NSIS 安装包。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
